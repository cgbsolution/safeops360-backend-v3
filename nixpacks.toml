providers = ["python"]

[phases.setup]
nixPkgs = ["python312", "postgresql_16.dev", "gcc"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip setuptools wheel",
  ". /opt/venv/bin/activate && pip install ."
]

[start]
# 2 workers, not 1. A single uvicorn process serves the whole platform, so any
# slow query or blocking call stalls EVERY user with no second process to
# absorb it — indistinguishable from "the server is down" at the frontend.
# DB pool is per worker (pool_size=10, max_overflow=20) → 2 workers = up to 60
# pooled connections, multiplexed by the Supabase transaction pooler on :6543.
# See docs/ops/BACKEND_DOWNTIME.md §4.3. Set a Dokploy memory limit alongside.
cmd = "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-3000} --proxy-headers --forwarded-allow-ips=* --workers 2 --timeout-keep-alive 65"
